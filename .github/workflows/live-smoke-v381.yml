name: Live smoke test Planlamasyon v3.8.1

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/live-smoke-v381.yml'

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Canlı sağlık ve sürüm doğrulaması
        shell: bash
        run: |
          set -euo pipefail
          LIVE_ORIGIN='https://planlamasyon.truvaai0.workers.dev'

          success='false'
          for attempt in $(seq 1 12); do
            http_code="$(curl -sS --connect-timeout 10 --max-time 20 \
              -H 'Accept: application/json' \
              -o health.json \
              -w '%{http_code}' \
              "${LIVE_ORIGIN}/api/health" || true)"

            if [ "$http_code" = '200' ] && node -e "const fs=require('node:fs'); const h=JSON.parse(fs.readFileSync('health.json','utf8')); if (h.ok !== true || h.app !== 'planlamasyon-v3.8.1') process.exit(1);"; then
              success='true'
              break
            fi

            sleep 5
          done

          test "$success" = 'true'
          node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          if (health.ok !== true) throw new Error('Canlı sağlık durumu başarılı değil.');
          if (health.app !== 'planlamasyon-v3.8.1') throw new Error(`Beklenen sürüm bulunamadı: ${health.app}`);
          if (health.runtime !== 'cloudflare-worker') throw new Error(`Beklenen Cloudflare runtime bulunamadı: ${health.runtime}`);
          if (health.modules?.openOfficialSourceScan !== true) throw new Error('Açık resmî kaynak taraması canlıda etkin değil.');
          if (health.modules?.embeddedOpenOfficialZoningRecords < 1) throw new Error('v3.8.1 gömülü resmî kayıtları canlıda bulunamadı.');
          console.log(JSON.stringify({
            ok: health.ok,
            app: health.app,
            runtime: health.runtime,
            openOfficialSourceScan: health.modules.openOfficialSourceScan,
            embeddedOpenOfficialZoningRecords: health.modules.embeddedOpenOfficialZoningRecords,
            time: health.time
          }, null, 2));
          NODE

          curl -fsSL --connect-timeout 10 --max-time 20 "${LIVE_ORIGIN}/" -o index.html
          grep -Fq 'v3.8.1' index.html
          grep -Fq '/app.js?v=3.8.1' index.html
          grep -Fq '/styles.css?v=3.8.1' index.html
          echo 'Canlı ana sayfa ve v3.8.1 statik varlık sürümleri doğrulandı.'
