name = "planlamasyon"
main = "src/worker.js"
compatibility_date = "2026-08-24"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[vars]
OPEN_OFFICIAL_SOURCE_TIMEOUT_MS = "6000"
OPEN_OFFICIAL_SOURCE_TOTAL_BUDGET_MS = "9000"
OPEN_OFFICIAL_SOURCE_CONCURRENCY = "6"
OVERPASS_TOTAL_TIMEOUT_MS = "8000"
OVERPASS_TIMEOUT_MS = "3500"
ENVIRONMENT_RADIUS_METERS = "1500"
NOMINATIM_FALLBACK_ENABLED = "true"
PLAN_AI_TIMEOUT_MS = "24000"
PLAN_AI_AUTO_ENABLED = "false"
PLAN_AI_CHAT_MAX_TOKENS = "650"
PLAN_AI_MAX_POLL_ATTEMPTS = "30"
PLAN_AI_POLL_INTERVAL_MS = "400"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
